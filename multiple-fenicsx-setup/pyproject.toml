[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "fenicsx-demo"
version = "0.1.0"
description = "Placeholder package for testing code against several DOLFINx versions"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ email = "henriknf@simula.no" }]
# DOLFINx (fenics-dolfinx) is expected to be installed in the environment,
# e.g. via the ghcr.io/fenics/dolfinx/dolfinx Docker image.
dependencies = ["fenics-dolfinx", "numpy"]

[project.optional-dependencies]
test = ["pytest"]
dev = ["fenicsx-demo[test]", "ruff"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
